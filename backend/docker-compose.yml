services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shang_an_huanhuan
      POSTGRES_USER: app
      POSTGRES_PASSWORD: change-me-before-deploy
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
